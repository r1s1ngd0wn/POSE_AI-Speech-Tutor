services:
  backend:
    build: ./backend
    volumes:
      - ./AI_USAGE.md:/app/AI_USAGE.md:ro
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173
      - TRUST_PROXY=1
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL to the Supabase Postgres connection string}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - TUTOR_PIN_SECRET=${TUTOR_PIN_SECRET:?Set TUTOR_PIN_SECRET to a long random value}
      # Lessons and reports: "local" needs a model server reachable from inside the container
      # (use http://host.docker.internal:1234/v1, not localhost); "openrouter" needs the key and model.
      - TUTOR_LLM_PROVIDER=${TUTOR_LLM_PROVIDER:-}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # Server-side speech (optional).
      - TUTOR_STT_PROVIDER=${TUTOR_STT_PROVIDER:-}
      - TUTOR_TTS_PROVIDER=${TUTOR_TTS_PROVIDER:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
